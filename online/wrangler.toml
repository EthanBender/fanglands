# Fanglands online — one Cloudflare Worker serves the game and runs the world.
# Nothing runs on any of our computers. Deploy: ./deploy.sh (from the repo root: build, test, then this).
# Two addresses (docs/ONLINE.md): fanglands.com is the home; gorkscape.ca hands each browser over to it.
name = "fanglands"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The hand-over switch (src/handoff.js frontDoor; docs/ONLINE.md "Two addresses"), kept HERE so every deploy from any
# tree carries it: "off" = gorkscape.ca serves the game as before; "on" = gorkscape.ca hands each browser over to
# fanglands.com. It is turned on, or rolled back, by a commit on master, never by a --var alone (the next plain deploy
# from anywhere would undo that). The test world keeps these lines (deploy-test.sh); `--var HANDOVER:on` overrides it
# there for a proof.
[vars]
HANDOVER = "off"

[assets]
directory = "./public"
binding = "ASSETS"
# every request reaches the worker first, so a page on gorkscape.ca can be the hand-over page (src/handoff.js)
run_worker_first = true

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

[[routes]]
pattern = "gorkscape.ca"
custom_domain = true

[[routes]]
pattern = "www.gorkscape.ca"
custom_domain = true

[[routes]]
pattern = "fanglands.com"
custom_domain = true

[[routes]]
pattern = "www.fanglands.com"
custom_domain = true
