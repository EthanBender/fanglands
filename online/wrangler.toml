# Fanglands online — one Cloudflare Worker serves the game and runs the world.
# Nothing runs on any of our computers. Deploy: ./deploy.sh (from the repo root: build, test, then this).
# Two addresses (docs/ONLINE.md): fanglands.com is the home; gorkscape.ca hands each browser over to it.
name = "fanglands"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The hand-over switch (src/handoff.js frontDoor; docs/ONLINE.md "Two addresses"), kept HERE so every deploy from any
# tree carries it: "on" = gorkscape.ca sends each browser to fanglands.com (with its login and settings); anything else
# ("off", missing, misspelled) = gorkscape.ca serves the game as before. It is turned on, or rolled back, by a commit on master, never by a --var alone (the next plain deploy
# from anywhere would undo that). The test world keeps these lines (deploy-test.sh); `--var HANDOVER:on` overrides it
# there for a proof.
[vars]
HANDOVER = "off"
# The owner's knights (docs/ONLINE.md, "The teacher view", "Teachers in the game"): an admin knight named here (comma-separated,
# any case) gets the Teachers section in the game's Admin panel and may make, reset and turn off teacher sign-ins from it.
# Being an admin is not enough; another admin gets no section and a 403 on every teacher call. Kept HERE so every deploy
# carries it (deploy.sh refuses a tree without it); the test world's copy names its own owner account (deploy-test.sh).
OWNER_KNIGHTS = "MudGoll"

[assets]
directory = "./public"
binding = "ASSETS"
# every request reaches the worker first, so a page on gorkscape.ca can be the hand-over page (src/handoff.js)
run_worker_first = true

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

[[routes]]
pattern = "gorkscape.ca"
custom_domain = true

[[routes]]
pattern = "www.gorkscape.ca"
custom_domain = true

[[routes]]
pattern = "fanglands.com"
custom_domain = true

[[routes]]
pattern = "www.fanglands.com"
custom_domain = true
