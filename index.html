const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const MONSTER_SPAWNS = [];
const spawnList = (type, list) => { for (const [x, y] of list) MONSTER_SPAWNS.push({ type, tx: x, ty: y }); };

function generateWorld() {
  const rnd = mulberry32(WORLD_SEED);
  MONSTER_SPAWNS.length = 0;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const n = Math.sin(x * 0.37) * Math.cos(y * 0.29) + Math.sin((x + y) * 0.13) * 0.6;
    map[idx(x, y)] = n > 0.95 ? T.DIRT : T.GRASS;
    variant[idx(x, y)] = Math.floor(rnd() * 3);
  }
  // ---- the cave ----
  for (let y = 0; y <= 15; y++) for (let x = 0; x <= CAVE_EXIT_X; x++) {
    const border = x === 0 || y === 0 || y === 15 || (x >= 16 && (y < 6 || y > 8));
    setTile(x, y, border ? T.WALL : T.CAVE);
  }
  for (let x = 16; x <= CAVE_EXIT_X; x++) { setTile(x, 5, T.WALL); setTile(x, 9, T.WALL); }
  for (const [px, py] of [[3, 3], [4, 3], [8, 11], [9, 11], [9, 12], [12, 3], [13, 4], [5, 12], [13, 11]]) setTile(px, py, T.WALL);
  // ---- roads ----
  const road = (pts, tile = T.DIRT, width = 1, chance = 0.7) => {
    for (let s = 0; s < pts.length - 1; s++) {
      const [ax, ay] = pts[s], [bx, by] = pts[s + 1]; const steps = Math.max(Math.abs(bx - ax), Math.abs(by - ay));
      for (let k = 0; k <= steps; k++) { const x = Math.round(ax + (bx - ax) * k / steps), y = Math.round(ay + (by - ay) * k / steps);
        for (let dy = -width; dy <= width; dy++) for (let dx = -width; dx <= width; dx++) if (Math.abs(dx) + Math.abs(dy) <= width && rnd() < chance) { const t = tileAt(x + dx, y + dy); if (t === T.GRASS || t === T.DIRT) setTile(x + dx, y + dy, tile); } }
    }
  };
  road([[CAVE_EXIT_X + 1, 7], [SIGN_TILE.x, SIGN_TILE.y], [84, 32]]);
  road([[SIGN_TILE.x, SIGN_TILE.y], [54, 14]], T.DIRT, 0, 0.8); // quarry spur
  road([[84, 32], [84, 60], [60, 70], [31, 76]], T.DIRT, 0, 0.6); // path into Wolfwood
  road([[141, 32], [150, 30]], T.DIRT, 0, 0.8); // east to the camp
  // ---- ponds ----
  for (const [px, py, pr] of [[43, 36, 4.5], [134, 60, 3.2]]) for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const d = dist(x, y, px, py);
    if (d < pr + Math.sin(x * 1.3 + y * 0.7) * 1.2) setTile(x, y, T.WATER);
    else if (d < pr + 2 + Math.sin(x * 0.9 + y * 1.1)) if (tileAt(x, y) !== T.WATER) setTile(x, y, T.SAND);
  }
  // ---- forests, rocks, flowers ----
  const inVillage = (x, y) => x >= VILLAGE.x0 && x <= VILLAGE.x1 && y >= VILLAGE.y0 && y <= VILLAGE.y1;
  const inQuarry = (x, y) => x >= 48 && x <= 60 && y >= 3 && y <= 12;
  const inCamp = (x, y) => x >= 142 && x <= 158 && y >= 20 && y <= 40;
  for (let y = 0; y < MAP_H; y++) for (let x = CAVE_EXIT_X + 1; x < MAP_W; x++) {
    const t = tileAt(x, y);
    if (t !== T.GRASS) continue;
    if (Math.abs(x - SIGN_TILE.x) < 3 && Math.abs(y - SIGN_TILE.y) < 3) continue;
    if (inVillage(x, y) || inCamp(x, y)) continue;
    const r = rnd();
    if (inQuarry(x, y)) { if (r < 0.30) setTile(x, y, T.ROCK); else if (r < 0.42) setTile(x, y, T.IRON); else if (r < 0.48) setTile(x, y, T.COAL); continue; }
    const wolfwood = y >= 62, thicket = (x > 56 && x < 80 && y < 14) || (x > 141 && y > 44);
    const treeChance = wolfwood ? 0.26 : thicket ? 0.22 : 0.07;
    if (r < treeChance) setTile(x, y, rnd() < (wolfwood ? 0.3 : 0.15) ? T.OAK : T.TREE);
    else if (r < treeChance + 0.025) setTile(x, y, rnd() < 0.2 ? T.IRON : T.ROCK);
    else if (r < treeChance + 0.045) setTile(x, y, wolfwood ? T.MUSHROOM : T.FLOWERS);
  }
  for (let x = 0; x < MAP_W; x++) { if (x > CAVE_EXIT_X) setTile(x, 0, T.TREE); setTile(x, MAP_H - 1, T.TREE); }
  for (let y = 0; y < MAP_H; y++) { setTile(MAP_W - 1, y, T.TREE); if (y > 15) setTile(0, y, T.TREE); }
  // ---- landmarks ----
  setTile(SIGN_TILE.x, SIGN_TILE.y, T.SIGN);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) setTile(SIGN_TILE.x + dx, SIGN_TILE.y + dy, T.DIRT);
  setTile(23, 9, T.AXESTUMP); setTile(22, 9, T.GRASS); setTile(24, 9, T.GRASS);
  setTile(54, 13, T.CART); for (let dx = -1; dx <= 1; dx++) setTile(54 + dx, 14, T.DIRT);
  setTile(12, 70, T.GRAVE); // the last knight
  for (const [sx, sy] of [[58, 84], [62, 84], [64, 87], [62, 90], [58, 90], [56, 87]]) setTile(sx, sy, T.STONECIRCLE);
  for (let y = 85; y <= 89; y++) for (let x = 57; x <= 63; x++) if (tileAt(x, y) !== T.STONECIRCLE) setTile(x, y, T.GRASS);
  // ruined watchtower with a chest
  for (let y = 78; y <= 84; y++) for (let x = 92; x <= 98; x++) setTile(x, y, T.GRASS);
  for (const [rx, ry] of [[93, 79], [94, 79], [95, 79], [97, 79], [93, 80], [93, 82], [97, 80], [97, 81], [93, 83], [95, 83], [96, 83], [97, 83]]) setTile(rx, ry, T.CWALL);
  setTile(95, 81, T.CHEST); setTile(94, 81, T.RUBBLE); setTile(96, 82, T.RUBBLE);
  // ---- village ----
  for (let y = VILLAGE.y0; y <= VILLAGE.y1; y++) for (let x = VILLAGE.x0; x <= VILLAGE.x1; x++) if ([T.TREE, T.OAK, T.ROCK, T.IRON, T.COAL, T.FLOWERS, T.MUSHROOM].includes(tileAt(x, y))) setTile(x, y, T.GRASS);
  for (let x = VILLAGE.x0; x <= VILLAGE.x1; x++) for (let dy = -1; dy <= 1; dy++) setTile(x, 32 + dy, T.COBBLE); // main street
  for (let y = 16; y <= 41; y++) setTile(112, y, T.COBBLE); for (let y = 16; y <= 41; y++) setTile(111, y, T.COBBLE); // north-south street
  for (let y = 26; y <= 38; y++) for (let x = 104; x <= 120; x++) setTile(x, y, T.COBBLE); // square
  for (let y = 27; y <= 31; y++) for (let x = 97; x <= 99; x++) setTile(x, y, T.DIRT); // lane to smithy row
  for (let y = 27; y <= 31; y++) setTile(126, y, T.DIRT); for (let y = 33; y <= 44; y++) setTile(126, y, T.DIRT); // east lane
  for (let x = 88; x <= 104; x++) setTile(x, 44, T.DIRT); // south lane
  setTile(116, 35, T.FIRE);
  for (let y = 50; y <= 53; y++) for (let x = 126; x <= 132; x++) setTile(x, y, T.SOIL); // allotments
  // village fence + gates
  for (let x = VILLAGE.x0; x <= VILLAGE.x1; x++) { setTile(x, VILLAGE.y0, T.FENCE); setTile(x, VILLAGE.y1, T.FENCE); }
  for (let y = VILLAGE.y0; y <= VILLAGE.y1; y++) { setTile(VILLAGE.x0, y, Math.abs(y - 32) <= 1 ? T.GATE : T.FENCE); setTile(VILLAGE.x1, y, Math.abs(y - 32) <= 1 ? T.GATE : T.FENCE); }
  // castle ring + portcullis + towers (corner CWALL); the keep is a building
  for (let y = CASTLE.y; y < CASTLE.y + CASTLE.h; y++) for (let x = CASTLE.x; x < CASTLE.x + CASTLE.w; x++) {
    const edge = x === CASTLE.x || y === CASTLE.y || x === CASTLE.x + CASTLE.w - 1 || y === CASTLE.y + CASTLE.h - 1;
    setTile(x, y, edge ? T.CWALL : T.COBBLE);
  }
  setTile(111, CASTLE.y, T.PORTCULLIS); setTile(112, CASTLE.y, T.PORTCULLIS);
  // training yard
  for (let y = 40; y <= 46; y++) for (let x = 85; x <= 90; x++) setTile(x, y, (x === 85 || x === 90 || y === 40 || y === 46) ? T.FENCE : T.DIRT);

function addItem(id, qty = 1) {

}

const playerWho = () => player.mech ? 'beast' : 'person';

}
const INTERESTING = t => [T.TREE, T.OAK, T.ROCK, T.IRON, T.COAL, T.PLANK, T.FIRE, T.OVEN, T.SIGN, T.WATER, T.DUMMY, T.GRAVE, T.SOIL, T.CROP, T.ANVIL, T.FORGE, T.WORKBENCH, T.ALCHEMY, T.WORKSHOP, T.CHEST, T.LODESTONE, T.BED, T.WRECK, T.MECH, T.CART, T.AXESTUMP, T.STONECIRCLE, T.GOLDPILE, T.COUNTER, T.THRONE, T.TRAP, T.STUMP, T.RUBBLE].includes(t);

  }
  for (const t of cands) if (INTERESTING(tileAt(t.tx, t.ty))) return t;
  return cands[0];
}
function npcInFront() {

    const d = dist(player.x, player.y, n.px, n.py);
    if (d > 118) continue;
    if (insideBuilding(Math.floor(player.x / TILE), Math.floor(player.y / TILE)) !== insideBuilding(Math.floor(n.px / TILE), Math.floor(n.py / TILE))) continue; // no talking through walls

  [T.IRON]: { skill: 'mining', tool: 'pickaxe', lv: 5, xp: 35, item: 'iron_ore', fall: 1, leaves: T.RUBBLE, regrow: 45, label: 'iron rock' },
  [T.COAL]: { skill: 'mining', tool: 'pickaxe', lv: 10, xp: 50, item: 'coal', fall: 1, leaves: T.RUBBLE, regrow: 60, label: 'coal rock' },

function startGather(tx, ty) {

  if (skillLv(g.skill) < g.lv) { notify(`You need ${SKILL_DEFS.find(s => s.key === g.skill).name} level ${g.lv} for this ${g.label}.`); return; }

function finishGather() {

  giveOrDrop(g.item, 1, player.x, player.y); gainXp(g.skill, g.xp);
  if (Math.random() < g.fall) { changeTile(a.tx, a.ty, g.leaves); regrow.push({ i: idx(a.tx, a.ty), t, timer: g.regrow }); }

}
function startFishing(tx, ty) {

// ---------- crafting and stations ----------
function craft(recipe) {

  for (const [id, q] of recipe.needs) if (countItem(id) < q) { notify(`Need ${q} ${ITEMS[id].name}.`); return false; }
  if (recipe.station === 'anvil' && !hasTool('hammer')) { notify('You need a hammer (Marta or Brakka sells one).'); return false; }
  for (const [id, q] of recipe.needs) removeItem(id, q);
  if (!canFit(recipe.out, recipe.qty)) { for (const [id, q] of recipe.needs) addItem(id, q); notify('Your pack is full.'); return false; }
  if (recipe.station === 'anvil' || recipe.station === 'forge') { player.action = { type: recipe.station === 'anvil' ? 'smith' : 'smelt', t: 0, need: recipe.station === 'anvil' ? 1.8 : 1.5, recipe }; return true; }
  finishCraft(recipe); return true;
}
function finishCraft(recipe) {

function placeAction(id) {

  const ox = player.x, oy = player.y;

  for (let k = 0; k < 12 && circleHitsTile(player.x, player.y, player.r + 1, tx, ty) && SOLID.has(t2); k++) {
    const nx = player.x - player.facing.x * 2.5, ny = player.y - player.facing.y * 2.5;
    if (collides(nx, ny, player.r)) break;
    player.x = nx; player.y = ny;
  }
  if (SOLID.has(t2) && circleHitsTile(player.x, player.y, player.r + 1, tx, ty)) { changeTile(tx, ty, t); player.x = ox; player.y = oy; notify('No room. Step back a little.'); return; }
  removeItem(id, 1); burst(tc(tx), tc(ty), '#c8a06a', 8, 50);
  if (t2 === T.LODESTONE) { player.home = { x: tc(tx), y: tc(ty) + TILE }; notify('Lodestone placed. This is home now. Press H to return (5 minute cooldown).'); }
  save();
}
function useItem(slot) {

// ---------- world interaction ----------
function useAction() {

  if (player.mech) { const ft = frontTile(player); if (tileAt(ft.tx, ft.ty) === T.PLANK) { changeTile(ft.tx, ft.ty, T.GRASS); burst(tc(ft.tx), tc(ft.ty), '#8b5a2b', 12, 80); notify('The walker crushes the planks.'); } else notify('Press X to climb out of the walker.'); return; }
  const npc = npcInFront();
  if (npc) { talkTo(npc); return; }
  const { tx, ty } = frontTile(player);
  const t = tileAt(tx, ty);
  const b = buildingAt(tx, ty);
  if (t === T.SIGN) { say("→ THISTLEDOWN, 1 mile.   → GREY QUARRY, north.   → HOLLOWFORD (crossed out, burned at the edges).", 'Signpost'); if (quest.stage === 4) advanceQuest(5); return; }
  if (t === T.CHEST) { if (b && b.coffin) { openPanel('coffin'); return; } if (b && b.id === 'bank') { openPanel('bank'); return; } openLootChest(tx, ty); return; }
  if (t === T.GOLDPILE) { notify("Death's gold. He is watching. Leave it."); return; }
  if (t === T.GRAVE) { say('Here lies the last knight of Hollowford. The road took him. The road takes everyone.', 'Gravestone'); return; }
  if (t === T.STONECIRCLE) { player.hp = player.maxHp; burst(player.x, player.y, '#b58cff', 20, 100); say('The old stones hum. Your wounds close. Someone built this long before goblins.', 'The Voice'); return; }
  if (t === T.DUMMY) { notify(`Swing (Space) at the dummy. Your highest hit so far: ${player.highestHit}.`); return; }
  if (t === T.AXESTUMP) { if (!player.tookAxe) { player.tookAxe = true; changeTile(tx, ty, T.STUMP); giveOrDrop('bronze_axe', 1, player.x, player.y); say('A bronze axe, left in a stump. Someone came this way before you. Trees are yours now.', 'The Voice'); save(); } return; }
  if (t === T.CART) { if (!player.tookPick) { player.tookPick = true; giveOrDrop('bronze_pickaxe', 1, player.x, player.y); notify('A bronze pickaxe from the miners’ cart. Face a rock and press E.'); save(); } else notify('An empty miners’ cart.'); return; }
  if (t === T.WATER) { startFishing(tx, ty); return; }
  if (t === T.FIRE || t === T.OVEN) { startCook(); return; }
  if (t === T.SOIL) { plantSeed(tx, ty); return; }
  if (t === T.CROP) { harvest(tx, ty); return; }
  if (t === T.ANVIL) { openPanel('station', 'anvil'); return; }
  if (t === T.FORGE) { openPanel('station', 'forge'); return; }
  if (t === T.WORKBENCH) { openPanel('station', 'workbench'); return; }
  if (t === T.WORKSHOP) { openPanel('station', 'workshop'); return; }
  if (t === T.ALCHEMY) { openPanel('station', 'alchemy'); return; }
  if (t === T.LODESTONE) { player.home = { x: tc(tx), y: tc(ty) + TILE }; notify('Home set here. Press H to return (5 minute cooldown).'); save(); return; }
  if (t === T.BED) { const near = nearestTileOfType(tx, ty, T.LODESTONE, 6); if (b && b.id !== undefined && !player.home) { /* inn / house beds */ } if (near || (b && b.id === 'inn' && player.innRested)) { player.bedSpawn = { x: tc(tx), y: tc(ty) + TILE }; player.hp = player.maxHp; say(near ? 'You sleep. The lodestone hums. You will wake here if you fall.' : 'You sleep well. You will wake here if you fall.', 'The Voice'); save(); } else notify(b && b.id === 'inn' ? 'Pay Dorran for the room first.' : 'A bed needs a lodestone within a few tiles to hold your spirit. Craft one at a workbench.'); return; }
  if (t === T.WRECK) { repairMech(tx, ty); return; }
  if (t === T.MECH) { enterMech(tx, ty); return; }
  if (t === T.TRAP) { changeTile(tx, ty, T.GRASS); giveOrDrop('goblin_trap', 1, player.x, player.y); return; }
  if (t === T.COUNTER || t === T.THRONE) { notify(t === T.THRONE ? "The Duke's seat. Speak to him, not the chair." : 'Speak to whoever is behind the counter.'); return; }
  if (GATHER[t]) { startGather(tx, ty); return; }

  notify('Nothing to use here. Face a tree, rock, water, fire, station or person and press E.');
}

// ---------- death's chest ----------
function coffinFee() {
  if (!deathKeep) return 0;
  let fee = 0; for (const s of deathKeep.items) { if (s.id === 'coins') continue; const v = ITEMS[s.id].value * s.qty; if (v >= 20) fee += Math.ceil(v * 0.25); }
  return fee;
}
function reclaimFromDeath() {
  let fee = coffinFee();
  // Death takes his share from the coins he already holds, then from your pack
  const held = deathKeep.items.find(s => s.id === 'coins');
  if (held) { const take = Math.min(held.qty, fee); held.qty -= take; fee -= take; if (held.qty <= 0) deathKeep.items = deathKeep.items.filter(s => s !== held); }
  if (fee > 0 && coins() < fee) { notify(`Death wants ${fee} more coins. You have ${coins()}.`); return; }
  if (fee > 0) payCoins(fee);
  const left = [];
  for (const s of deathKeep.items) { const rest = addItem(s.id, s.qty); if (rest > 0) left.push({ id: s.id, qty: rest }); }
  deathKeep = left.length ? { items: left } : null;
  say(left.length ? "Your pack is full. I will keep the rest. For now." : "Take them. We will meet again. Everyone does.", 'Death');
  if (!deathKeep) closePanel();
  save();
}

    if (pressed.has('KeyI')) toggle('inventory');
    if (pressed.has('KeyC')) toggle('craft');
    if (pressed.has('KeyJ')) toggle('quests');
    if (pressed.has('KeyM')) toggle('map');
    if (pressed.has('KeyH')) goHome();

    for (let k = 1; k <= 5; k++) if (pressed.has('Digit' + k)) useItem(k - 1);

  if (!dialog.cur && dialog.queue.length) { dialog.cur = dialog.queue.shift(); dialog.shown = 0; dialog.t = 0; }
  if (dialog.cur) { dialog.t += dt; dialog.shown = Math.min(dialog.cur.text.length, Math.floor(dialog.t * 34)); if (dialog.t > 2.4 + dialog.cur.text.length / 18) advanceDialog(); }

    for (const d of drops) {

    m.attackCd = Math.max(0, m.attackCd - dt); m.hurtT = Math.max(0, m.hurtT - dt); m.stunT = Math.max(0, (m.stunT || 0) - dt);
    // traps
    { const tx = Math.floor(m.x / TILE), ty = Math.floor(m.y / TILE); if (tileAt(tx, ty) === T.TRAP && !def.human) { changeTile(tx, ty, T.GRASS); m.hp -= 12; m.stunT = 2; m.hurtT = 0.3; floatText(m.x, m.y - m.r - 6, '-12 trap', '#ffd166'); burst(m.x, m.y, '#8f96a3', 12, 90); if (m.hp <= 0) { killMonster(m); continue; } } }

    if (m.state === 'chase' && (dp > def.sight * 1.6 || dHome > 14 * TILE || player.dead)) m.state = 'return';

        m.facing = { x: dx / d, y: dy / d };

      } else {

const cam = { x: 0, y: 0 };

  const g = miniCanvas.getContext('2d');

  for (const b of BUILDINGS) { g.fillStyle = b.roof; g.fillRect(b.x, b.y, b.w, b.h); }

  cam.x = clamp(player.x - VW / 2, 0, MAP_W * TILE - VW);
  cam.y = clamp(player.y - VH / 2, 0, MAP_H * TILE - VH);
  if (MAP_W * TILE < VW) cam.x = (MAP_W * TILE - VW) / 2;
  if (MAP_H * TILE < VH) cam.y = (MAP_H * TILE - VH) / 2;

{

  function resetLive(id) { live.id = id; live.facing = { x: 0, y: 1 }; live.hurtT = 0; live.attackT = 0; live.attackCd = 0.3; live.walkT = 0; live.moving = false; live.sinceHurt = 99; live.stuckT = 0; }

      const gh = { ...gob.home }; gob.dead = false; gob.hp = gob.maxHp; gob.stunT = 0; gob.attackCd = 0; gob.x = player.x + 70; gob.y = player.y; gob.home = { x: gob.x, y: gob.y }; gob.state = 'chase'; gob.angry = true; gob.wanderT = 99;

      gob.home = gh; gob.x = gh.x; gob.y = gh.y; gob.state = 'idle'; gob.hp = gob.maxHp; gob.dead = false; h.peace(true); }
    // Garrick: refuses below combat level 6, hires for 150 coins, replaces Sera
    { F.tp(125, 48); F.sim(3, []);

      closePanel(); player.skills.melee.xp = XP_TABLE[6]; player.skills.defence.xp = XP_TABLE[6]; recomputeMaxHp(); h.give('coins', 200); const c0 = coins();
      const w2 = F.talk('garrick'); const opened = panel === 'companion' && panelArg && panelArg.hire === 'garrick';
      const hired = F.clickButton('Hire');
      check('companion: Garrick hires for 150 coins at combat level 6 and replaces Sera', opened && hired && c.id === 'garrick' && c.hp === 90 && coins() === c0 - 150 && NPCS.some(n => n.id === 'sera') && !NPCS.some(n => n.id === 'garrick'), { w2, cb: combatLevel(), opened, hired, id: c.id, coins: coins(), c0 }); }
    // Garrick fights up close
    { closePanel(); const s = openStrip(40, 24, 5); F.tp(s.x, s.y); F.sim(3, []); h.peace(false); player.hp = player.maxHp; player.facing = { x: 1, y: 0 };
      const gob = monsters.find(m => m.type === 'goblin' && m.home.x < 100 * TILE) || monsters.find(m => m.type === 'goblin');
      const gh = { ...gob.home }; gob.dead = false; gob.hp = gob.maxHp; gob.stunT = 0; gob.attackCd = 0; gob.x = player.x + 60; gob.y = player.y; gob.home = { x: gob.x, y: gob.y }; gob.state = 'chase'; gob.angry = true; gob.wanderT = 99;
      c.x = player.x - 40; c.y = player.y; live.attackCd = 0;

    // falls back, returns at half hp
    { c.hp = 1; hurtCompanion(c, HEROES.garrick, 5, c.x + 10, c.y); const down = c.downT > 0 && levelBanner && /falls back/.test(levelBanner.text);
      c.downT = 0.05; F.sim(6, []); check('companion: a downed hero falls back and returns at half hp', down && c.downT === 0 && c.hp === 45 && c.id === 'garrick', { down, hp: c.hp, downT: c.downT }); }

    { const s = openStrip(40, 24, 5); F.tp(s.x, s.y); F.sim(3, []); player.facing = { x: 1, y: 0 }; c.x = player.x + 40; c.y = player.y;
      F.press('KeyE'); const opened = panel === 'companion' && !panelArg; const stay = F.clickButton('Stay here'); const stayed = c.mode === 'stay';
      c.x = player.x + 40; c.y = player.y; F.press('KeyE'); const follow = F.clickButton('Follow me'); const following = c.mode === 'follow';

      check('companion: E on your hero opens Stay / Follow / Dismiss; Dismiss sends Garrick back to the inn', opened && stay && stayed && follow && following && dismissed && c.id === null && NPCS.some(n => n.id === 'garrick') && NPCS.some(n => n.id === 'sera') && panel !== 'companion', { opened, stay, stayed, follow, following, dismissed, id: c.id }); }
    // tidy up for whoever tests next

    player.skills.melee.xp = xp0.melee; player.skills.defence.xp = xp0.defence; recomputeMaxHp();
    closePanel(); h.peace(false); save();

}

// ---- src/22-bulldozer.js ----
// ============================================================================
// FEATURE: THE GOBLIN BULLDOZER — Colin's second machine
// A wide, low goblin engine: a wooden deck bound in iron, four iron-shod wheels, a boiler on the
// back and a plow blade as wide as a door on the front. It charges, and it flattens what it hits.
// Kill it → a wreck. Repair the wreck (4 iron bars + 6 goblin scrap) → drive it. Everything here
// registers through HOOKS; no core file is edited.
// ============================================================================

// ---------- tiles ----------
// The walker owns T.WRECK / T.MECH (repairMech / enterMech / exitMech in the core), so the bulldozer
// gets its own pair of tiles.
const T_DOZER_WRECK = addTile('DOZER_WRECK', { solid: true, tex: 'dirt', mini: '#6b6b7a' });
const T_DOZER = addTile('DOZER', { solid: true, tex: 'dirt', mini: '#6b6b7a' });

// ---------- monster ----------
// NOTE: deliberately NOT `mech: true` — the core's killMonster would place a walker T.WRECK, speak the
// walker's line and tick the walker quest flag. The bulldozer's wreck is placed in HOOKS.kill instead.
MONSTER_DEFS.bulldozer = {
  name: 'Goblin bulldozer', level: 14, r: 22, hp: 110, att: 15, maxHit: 10, def: 14, speed: 60, aggro: true, sight: 5 * TILE, respawn: 300,
  drops: { always: [['goblin_scrap', 3, 6], ['iron_ore', 1, 3]], table: [['iron_bar', 1, 2, 10], ['blast_powder', 1, 2, 8], ['coal', 1, 2, 6]], rare: { chance: 8, table: [['iron_warhammer', 1, 1, 1]] } },
};
const DOZER_CHARGE_EVERY = 5, DOZER_CHARGE_TIME = 1, DOZER_CHARGE_SPEED = 220;
const DOZER_HP = 110, DOZER_REPAIR = [['iron_bar', 4], ['goblin_scrap', 6]];

// two of them: one in the Goblin Camp, one roaming the fields (the thicket north of the road)
HOOKS.world.push((rnd, api) => { api.spawnList('bulldozer', [[146, 38], [70, 8]]); });

// ---------- flattening ----------
// What the blade flattens, and what falls out of it. Everything becomes grass.
const DOZER_FLATTENS = new Map([[T.PLANK, 'plank'], [T.FENCE, null], [T.GATE, null], [T.TREE, 'wood'], [T.OAK, 'oak_log'], [T.CROP, null]]);
// Probe a few points in front of the blade (two distances × three across, the blade is wide) and flatten
// what is there. byPlayer: loot goes to the pack (giveOrDrop) instead of the ground. Returns tiles flattened.
function dozerPlow(e, dir, byPlayer) {
  let n = 0;
  const sx = -dir.y, sy = dir.x; // across the blade
  for (const ahead of [e.r + 6, e.r + 22]) for (const side of [-14, 0, 14]) {
    const tx = Math.floor((e.x + dir.x * ahead + sx * side) / TILE), ty = Math.floor((e.y + dir.y * ahead + sy * side) / TILE);
    const t = tileAt(tx, ty);
    if (!DOZER_FLATTENS.has(t)) continue;
    if ((t === T.FENCE || t === T.GATE) && inVillageBounds(tc(tx), tc(ty))) continue; // Thistledown's fence holds; the guards would not like that
    changeTile(tx, ty, T.GRASS);
    burst(tc(tx), tc(ty), t === T.TREE || t === T.OAK ? '#3d8a38' : t === T.CROP ? '#5aa33e' : '#8b5a2b', 12, 90);
    if (t === T.CROP) crops = crops.filter(c => c.i !== idx(tx, ty));
    if (t === T.TREE || t === T.OAK) regrow.push({ i: idx(tx, ty), t, timer: 120 }); // the wood grows back, slowly
    const item = DOZER_FLATTENS.get(t);
    if (item) { if (byPlayer) giveOrDrop(item, 1, player.x, player.y); else drops.push({ x: tc(tx), y: tc(ty), id: item, qty: 1, t: 0 }); }
    n++;
  }
  return n;
}

// ---------- wreck, repair, enter ----------
HOOKS.kill.push(m => {
  if (m.type !== 'bulldozer') return;
  const tx = Math.floor(m.x / TILE), ty = Math.floor(m.y / TILE);
  if (PLACEABLE_ON.has(tileAt(tx, ty))) changeTile(tx, ty, T_DOZER_WRECK);
  burst(m.x, m.y, '#8f96a3', 20, 140);
  say('The bulldozer shudders to a halt, boiler hissing. The goblin driver leaps off and runs. The wreck stays. Four iron bars and six scrap could set it rolling again.', 'The Voice');
});
function repairDozer(tx, ty) {
  const short = DOZER_REPAIR.filter(([id, q]) => countItem(id) < q);
  if (short.length) { notify(`A wrecked goblin bulldozer. Repair needs ${DOZER_REPAIR.map(([id, q]) => `${q} ${ITEMS[id].name.toLowerCase()}`).join(' and ')} (you have ${DOZER_REPAIR.map(([id]) => countItem(id)).join(' and ')}).`); return; }
  for (const [id, q] of DOZER_REPAIR) removeItem(id, q);
  changeTile(tx, ty, T_DOZER); burst(tc(tx), tc(ty), '#ffb347', 24, 110); gainXp('crafting', 100);
  say('Wooden deck, iron bands, a boiler, and a plow blade as wide as a door. Goblin-built, knight-sized. Press E to climb on.', 'The Voice'); save();
}
function enterDozer(tx, ty) {
  changeTile(tx, ty, T.DIRT); player.mech = { hp: DOZER_HP, maxHp: DOZER_HP, kind: 'dozer' }; player.x = tc(tx); player.y = tc(ty); player.r = 22; player.speed = 130; player.action = null;
  notify('You are on the bulldozer. Drive into trees, fences and planks to flatten them. Space shoves. X climbs down.'); save();
}
HOOKS.use.push((t, tx, ty) => {
  if (t === T_DOZER_WRECK) { repairDozer(tx, ty); return true; }
  if (t === T_DOZER) { enterDozer(tx, ty); return true; }
  return false;
});

// ---------- update: charging bulldozers, the driven bulldozer, and the exit fix-up ----------
// Exit fix-up. The core handles X (exitMech) and mech death (wreckMech) before HOOKS.update runs, and both
// place WALKER tiles (T.MECH / T.WRECK) because they do not know about the bulldozer. So each tick while
// driving we remember where the player was (`dozerSnap`); the tick the mech goes away we work out which
// tile the core just placed and swap it for the bulldozer's own tile:
//   - exitMech places T.MECH on the player's own tile (then steps the player back one tile) or, if that
//     tile is placeable, on frontTile(player, 44). Own tile is checked first: the player was standing on
//     it, so it cannot have been a parked walker already.
//   - wreckMech places T.WRECK on the player's own tile and steps the player back one tile along facing,
//     so the wreck sits at (player + facing * TILE).
// Dying in the bulldozer loses it, exactly like the walker (die() clears player.mech, no tile).
let dozerWas = false, dozerSnap = null;
function afterDozerLeft(snap) {
  if (player.dead) return;
  const wx = Math.floor((player.x + player.facing.x * TILE) / TILE), wy = Math.floor((player.y + player.facing.y * TILE) / TILE);
  if (tileAt(wx, wy) === T.WRECK && dialog.queue.some(d => /walker gives out/.test(d.text))) {
    changeTile(wx, wy, T_DOZER_WRECK);
    dialog.queue = dialog.queue.filter(d => !/walker gives out/.test(d.text));
    say('The bulldozer gives out under you. It can be repaired again: iron bars and scrap.', 'The Voice');
    return;
  }
  const own = { tx: Math.floor(snap.x / TILE), ty: Math.floor(snap.y / TILE) };
  const ft = frontTile(snap, 44);
  const spot = tileAt(own.tx, own.ty) === T.MECH ? own : tileAt(ft.tx, ft.ty) === T.MECH ? ft : null;
  if (!spot) return;
  changeTile(spot.tx, spot.ty, T_DOZER);
  notify('You climb down. The bulldozer waits.'); save();
}
HOOKS.update.push(dt => {
  const inDozer = !!(player.mech && player.mech.kind === 'dozer');
  if (dozerWas && !inDozer && dozerSnap) afterDozerLeft(dozerSnap);
  if (inDozer && !player.dead) {
    if (player.moving) dozerPlow(player, player.facing, true); // a slow lumber machine: trees go into the pack as logs
    // the core's messages say "walker"; fix the ones it shows while the bulldozer is driven
    if (notice && /walker/i.test(notice.text)) notice.text = notice.text.replace(/walker/gi, 'bulldozer');
    for (const f of floaters) if (/\(walker\)$/.test(f.text)) f.text = f.text.replace('(walker)', '(bulldozer)');
  }
  dozerWas = inDozer; dozerSnap = inDozer ? { x: player.x, y: player.y, r: player.r, facing: { x: player.facing.x, y: player.facing.y } } : null;

  // bulldozer monsters: every 5 s of chasing, a 1 s straight-line charge that flattens what it touches
  for (const m of monsters) {
    if (m.type !== 'bulldozer' || m.dead) continue;
    if (m.chargeT > 0) {
      m.chargeT -= dt;
      const d = m.chargeDir;
      m.facing = { x: d.x, y: d.y };
      moveEntity(m, d.x * DOZER_CHARGE_SPEED * dt, d.y * DOZER_CHARGE_SPEED * dt, 'beast');
      dozerPlow(m, d, false);
      m.moving = true; m.walkT += dt * 20;
      if (!m.chargeHit && !player.dead && dist(m.x, m.y, player.x, player.y) < m.r + player.r + 4) {
        m.chargeHit = true;
        hurtPlayer(rint(6, 12), m.x, m.y, true);
        for (let k = 0; k < 6; k++) moveEntity(player, d.x * 10, d.y * 10, playerWho()); // shoved 60px, sliding until something stops it
        burst(player.x, player.y, '#8f96a3', 14, 130); floatText(player.x, player.y - 40, 'RAMMED', '#ffb347', 14);
      }
      if (m.chargeT <= 0) m.chargeT = 0;
      continue;
    }
    if (m.state === 'chase' && !(m.stunT > 0)) {
      m.chargeCd = (m.chargeCd === undefined ? DOZER_CHARGE_EVERY : m.chargeCd) - dt;
      if (m.chargeCd <= 0) {
        const dx = player.x - m.x, dy = player.y - m.y, d = Math.hypot(dx, dy) || 1;
        m.chargeCd = DOZER_CHARGE_EVERY; m.chargeT = DOZER_CHARGE_TIME; m.chargeDir = { x: dx / d, y: dy / d }; m.chargeHit = false; m.charges = (m.charges || 0) + 1;
        floatText(m.x, m.y - m.r - 30, 'CHARGE!', '#ff8a1a', 15); burst(m.x - dx / d * 24, m.y - dy / d * 24, '#a8875a', 12, 70);
      }
    } else m.chargeCd = DOZER_CHARGE_EVERY;
  }
});
HOOKS.newGame.push(() => { dozerWas = false; dozerSnap = null; });

// ---------- HUD: the core writes "Walker hp/max" for any mech; re-badge it while driving the bulldozer ----------
HOOKS.hud.push(g => {
  if (!player.mech || player.mech.kind !== 'dozer') return;
  g.font = '13px sans-serif'; g.textAlign = 'left';
  const label = `Bulldozer ${player.mech.hp}/${player.mech.maxHp}`;
  const w = Math.max(g.measureText(`Walker ${player.mech.hp}/${player.mech.maxHp}`).width, g.measureText(label).width);
  g.fillStyle = 'rgba(10,14,22,0.95)'; roundRect(g, 186, 47, w + 10, 19, 5); g.fill(); g.strokeStyle = 'rgba(255,179,71,0.35)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = '#ffb347'; g.fillText(label, 190, 60);
});

// ---------- art ----------
// Medieval goblin tech only: wood, iron bands, rivets, a boiler. Drawn around 0,0; the machine rotates to
// e.facing, the driver stays upright like every other rider. Wheels are seen from above as treads whose
// iron shoes scroll with e.walkT. pilot = a playerLook() for the knight; e.parked = nobody aboard.
function drawDozer(g, e, hurt, pilot) {
  const ang = Math.atan2(e.facing.y, e.facing.x), c = Math.cos(ang), s = Math.sin(ang);
  const rolling = e.moving || e.chargeT > 0, charging = e.chargeT > 0;
  const shudder = rolling ? Math.sin(e.walkT * 2.1) * 0.8 : 0;
  const lunge = e.attackT > 0 ? (1 - e.attackT / 0.22) * 10 : 0;
  g.save(); g.rotate(ang);
  g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(6, 6, 42, 30, 0, 0, 7); g.fill();
  if (charging) { g.fillStyle = 'rgba(168,135,90,0.45)'; for (let k = 0; k < 4; k++) { const ph = (time * 9 + k * 1.7) % 4; g.beginPath(); g.arc(-36 - ph * 6, (k - 1.5) * 12 + Math.sin(time * 7 + k) * 3, 4 + ph * 1.6, 0, 7); g.fill(); } }
  // axles + four wheels
  g.strokeStyle = '#3a3a42'; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(-14, -27); g.lineTo(-14, 27); g.moveTo(14, -27); g.lineTo(14, 27); g.stroke();
  const bandOff = (e.walkT * 4) % 7;
  for (const [wx, wy] of [[-14, -27], [14, -27], [-14, 27], [14, 27]]) {
    g.fillStyle = '#2f2a26'; roundRect(g, wx - 10, wy - 5, 20, 10, 4); g.fill();
    g.fillStyle = '#5a4a3a'; roundRect(g, wx - 9, wy - 3.5, 18, 7, 3); g.fill();
    g.strokeStyle = '#8f96a3'; g.lineWidth = 1.6;
    for (let b = 0; b < 3; b++) { const bx = wx - 10 + (b * 7 + bandOff) % 21; if (bx > wx - 9 && bx < wx + 9) { g.beginPath(); g.moveTo(bx, wy - 5); g.lineTo(bx, wy + 5); g.stroke(); } }
  }
  g.translate(shudder, 0);
  // hull: a low wooden deck bound with iron
  g.fillStyle = hurt ? '#ffb0b0' : '#7a4a2a'; roundRect(g, -30, -21, 52, 42, 7); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1.2; for (const oy of [-14, -7, 0, 7, 14]) { g.beginPath(); g.moveTo(-28, oy); g.lineTo(20, oy); g.stroke(); }
  g.strokeStyle = '#3a3a42'; g.lineWidth = 3; for (const ox of [-8, 12]) { g.beginPath(); g.moveTo(ox, -21); g.lineTo(ox, 21); g.stroke(); }
  g.fillStyle = '#c9ccd3'; for (const [rx, ry] of [[-8, -17], [-8, 17], [12, -17], [12, 17]]) { g.beginPath(); g.arc(rx, ry, 1.5, 0, 7); g.fill(); }
  // boiler on the back: riveted iron drum, firebox glow, smokestack
  g.fillStyle = '#5a5a62'; roundRect(g, -31, -13, 18, 26, 6); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.15)'; roundRect(g, -29, -11, 5, 22, 3); g.fill();
  g.strokeStyle = '#3a3a42'; g.lineWidth = 2; g.beginPath(); g.moveTo(-31, -4); g.lineTo(-13, -4); g.moveTo(-31, 4); g.lineTo(-13, 4); g.stroke();
  g.fillStyle = `rgba(255,140,40,${0.5 + Math.sin(time * 6) * 0.2})`; g.fillRect(-16, -3, 4, 6);
  g.fillStyle = '#3a3a42'; g.beginPath(); g.arc(-22, -9, 4, 0, 7); g.fill(); g.fillStyle = '#1e1e24'; g.beginPath(); g.arc(-22, -9, 2, 0, 7); g.fill();
  // driver's bench
  g.fillStyle = '#5a3a1e'; roundRect(g, -6, -9, 12, 18, 3); g.fill();
  // push arms + the blade: a big angled iron plow, curved forward, riveted, worn bright at the edge
  g.strokeStyle = '#3a3a42'; g.lineWidth = 4; g.beginPath(); g.moveTo(10, -15); g.lineTo(27 + lunge, -22); g.moveTo(10, 15); g.lineTo(27 + lunge, 22); g.stroke();
  g.save(); g.translate(lunge, 0);
  g.fillStyle = '#4a4a52'; g.beginPath(); g.moveTo(24, -30); g.quadraticCurveTo(46, -18, 46, 0); g.quadraticCurveTo(46, 18, 24, 30); g.lineTo(28, 20); g.quadraticCurveTo(36, 10, 36, 0); g.quadraticCurveTo(36, -10, 28, -20); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1; g.beginPath(); g.moveTo(29, -23); g.quadraticCurveTo(41, -12, 41, 0); g.quadraticCurveTo(41, 12, 29, 23); g.stroke();
  g.strokeStyle = '#8f96a3'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(25, -29); g.quadraticCurveTo(46, -18, 46, 0); g.quadraticCurveTo(46, 18, 25, 29); g.stroke();
  g.fillStyle = '#c9ccd3'; for (const [rx, ry] of [[32, -18], [37, -7], [37, 7], [32, 18]]) { g.beginPath(); g.arc(rx, ry, 1.6, 0, 7); g.fill(); }
  g.restore();
  g.restore();
  // driver (screen space, upright): the knight, or a goblin in a leather cap with one goggle
  if (pilot) { g.save(); g.translate(0, -6); g.scale(0.7, 0.7); drawHuman(g, { facing: e.facing, hurtT: 0, attackT: 0 }, pilot); g.restore(); }
  else if (!e.parked) {
    const fx = e.facing.x, fy = e.facing.y;
    g.fillStyle = '#6fbf3f'; g.beginPath(); g.ellipse(0, -1, 7, 5, 0, 0, 7); g.fill();
    g.fillStyle = '#8ad35a'; g.beginPath(); g.arc(0, -9, 6, 0, 7); g.fill();
    g.beginPath(); g.moveTo(-5, -10); g.lineTo(-12, -14); g.lineTo(-5, -6); g.closePath(); g.moveTo(5, -10); g.lineTo(12, -14); g.lineTo(5, -6); g.closePath(); g.fill();
    g.fillStyle = '#4a3a2a'; g.beginPath(); g.arc(0, -11, 6.5, Math.PI, 0); g.fill();
    g.fillStyle = '#d62828'; g.beginPath(); g.arc(-2.2 + fx * 1.5, -9 + fy * 1.5, 1.3, 0, 7); g.arc(2.2 + fx * 1.5, -9 + fy * 1.5, 1.3, 0, 7); g.fill();
    g.fillStyle = '#c9ccd3'; g.beginPath(); g.arc(3, -12, 2.2, 0, 7); g.fill(); g.fillStyle = '#5a7aa0'; g.beginPath(); g.arc(3, -12, 1.2, 0, 7); g.fill();
  }
  // steam from the stack (stack sits at (-22,-9) in the rotated frame; steam rises in screen space)
  const stx = -22 * c + 9 * s, sty = -22 * s - 9 * c;

// ============================================================================
// LAW — consequences for attacking Thistledown.
// A wanted level (0–3) in player.law, hostile guards while wanted, shops that refuse you,
// reinforcements at the gates, and a Captain of the Watch who takes fines and buys goblin scrap.
// Registered entirely through HOOKS; no core file is edited.
// ============================================================================
const LAW_GUARD_TYPES = ['guard_m', 'guard_f'];
const LAW_HIT_TIMER = 120;     // seconds before the wanted level starts to decay after an offence
const LAW_DECAY = 60;          // seconds per level of decay once it starts
const LAW_KILL_FINE = 150;     // coins added to the fine for killing a guard
const LAW_LEVEL_FINE = 25;     // coins per wanted star when settling with the captain
const LAW_SCRAP_PAY = 5;       // coins per goblin scrap handed in
const LAW_ARM_RANGE = 8 * TILE; // guards within this range of the player are set hostile every tick while wanted
const LAW_TEMP_POSTS = [[86, 32], [139, 32]]; // reinforcement posts: just inside the west and east gates
const LAW_CAPTAIN = { id: 'captain', name: 'Captain Roderick', x: 110, y: 41, tunic: '#a8302a', hair: '#4a2a14', helmet: true, beard: true, role: 'captain' };
let lawArmed = false; // true while guards have been told to fight; stand them down when wanted returns to 0

const lawIsGuard = m => LAW_GUARD_TYPES.includes(m.type);
function law() { if (!player.law) player.law = { wanted: 0, timer: 0, fines: 0 }; return player.law; }
const lawStars = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 3 - n));
const lawFine = () => law().fines + law().wanted * LAW_LEVEL_FINE;
const lawOwes = () => law().wanted > 0 || law().fines > 0;

// ---------- offences ----------
function lawOffend(level) {
  const L = law(); const before = L.wanted;
  L.wanted = clamp(level, 0, 3); L.timer = LAW_HIT_TIMER;
  if (L.wanted > before) {
    floatText(player.x, player.y - 42, 'WANTED ' + '★'.repeat(L.wanted), '#ff6b6b', 16);
    notify(L.wanted >= 3 ? 'The whole watch is after you! Reinforcements at the gates.' : `The watch is after you! Wanted ${lawStars(L.wanted)}`);
    if (before === 0) say("Striking the watch inside the walls? The Captain will want words. And coin.", 'The Voice');
    save();
  }
}
HOOKS.hit.push((m, dmg) => {
  if (!lawIsGuard(m) || !inVillageBounds(m.x, m.y)) return;
  lawOffend(law().wanted + 1);
});
HOOKS.kill.push(m => {
  if (!lawIsGuard(m)) return;
  const L = law(); L.fines += LAW_KILL_FINE;
  lawOffend(3);
  notify(`A guard is down. Fine: ${L.fines} coins.`);
  say(`A guard of Thistledown, dead by a knight's hand. That is a ${LAW_KILL_FINE} coin fine, and the Captain will not forget it.`, 'The Voice');
  save();

// ---------- guards: arm, reinforce, stand down ----------
function lawTempGuard(tx, ty) {
  const d = MONSTER_DEFS.guard_m;
  return {
    type: 'guard_m', x: tc(tx), y: tc(ty), home: { x: tc(tx), y: tc(ty) },
    r: d.r, hp: d.hp, maxHp: d.hp, speed: d.speed, angry: true, state: 'idle', wanderT: 1,
    wander: { x: 0, y: 0 }, attackCd: 0, hurtT: 0, dead: false, deadT: 0, respawnT: 0, facing: { x: 1, y: 0 }, walkT: 0, moving: false, stunT: 0, temp: true,
  };
}
function lawSpawnReinforcements() {
  for (const [tx, ty] of LAW_TEMP_POSTS) { monsters.push(lawTempGuard(tx, ty)); burst(tc(tx), tc(ty), 'rgba(255,255,255,0.7)', 12, 70); }
}
function lawStandDown() {
  for (const m of monsters) if (lawIsGuard(m) && !m.dead) { m.angry = false; m.state = 'return'; }
  if (monsters.some(m => m.temp)) monsters = monsters.filter(m => !m.temp);
  lawArmed = false;
}
function lawArrest() {
  // The watch caught you (you fell while wanted): the stars become fine, the guards stand down. No death loops in town.
  const L = law();
  L.fines += L.wanted * LAW_LEVEL_FINE; L.wanted = 0; L.timer = 0;
  lawStandDown();
  say(`The watch drags you to the gate and turns out your pockets. You owe the town ${L.fines} coins. Pay the Captain by the castle.`, LAW_CAPTAIN.name);
  save();
}

HOOKS.update.push(dt => {
  const L = law();
  if (L.wanted > 0 && player.dead) lawArrest();
  if (L.wanted > 0) {
    L.timer -= dt;
    if (L.timer <= 0) {
      L.wanted -= 1; L.timer = L.wanted > 0 ? LAW_DECAY : 0;
      notify(L.wanted > 0 ? `The watch is losing interest. Wanted ${lawStars(L.wanted)}` : L.fines > 0 ? 'The watch has lost interest. Your fine still stands.' : 'The watch has lost interest in you.');
      save();

  const hasTemp = monsters.some(m => m.temp);
  if (L.wanted >= 3 && !hasTemp && !player.dead) lawSpawnReinforcements();
  if (L.wanted === 0 && hasTemp) monsters = monsters.filter(m => !m.temp);

        if (dist(m.x, m.y, player.x, player.y) < LAW_ARM_RANGE) { m.angry = true; m.state = 'chase'; }
