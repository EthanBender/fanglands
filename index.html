<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fanglands</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; height: 100%; }
  body { background: #0b0f14; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
<canvas id="game"></canvas>
<script>
'use strict';
// ============================================================================
// Fanglands v0 — "The Cave"
// A 2D top-down knight adventure. Textured shapes, not pixels.
// Everything is in this one file on purpose: open it and it runs.
// ============================================================================

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- constants ----------
const TILE = 48;
const MAP_W = 72, MAP_H = 56;
const WORLD_SEED = 20260907;
const CAVE_EXIT_X = 20; // tiles left of this are "the cave"
const T = { GRASS: 0, DIRT: 1, CAVE: 2, WALL: 3, WATER: 4, TREE: 5, ROCK: 6, PLANK: 7, SAND: 8, SIGN: 9 };
const SOLID = new Set([T.WALL, T.WATER, T.TREE, T.ROCK, T.PLANK, T.SIGN]);
const BLOCK_HITS = { [T.TREE]: 3, [T.ROCK]: 4, [T.PLANK]: 1 };
const SAVE_KEY = 'fanglands.save.v0';

// ---------- canvas ----------
const DISPLAY = '"Cinzel", "Trajan Pro", Georgia, serif';
if (document.fonts && document.fonts.load) { document.fonts.load('800 34px "Cinzel"').catch(() => { }); }
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR); canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
window.addEventListener('resize', resize);
resize();

// ============================================================================
// WORLD
// ============================================================================
const map = new Uint8Array(MAP_W * MAP_H);
const variant = new Uint8Array(MAP_W * MAP_H);
const blockHp = new Map(); // tile index -> hits remaining
const idx = (tx, ty) => ty * MAP_W + tx;
const inMap = (tx, ty) => tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H;
const tileAt = (tx, ty) => inMap(tx, ty) ? map[idx(tx, ty)] : T.WALL;
const setTile = (tx, ty, t) => { if (inMap(tx, ty)) map[idx(tx, ty)] = t; };

const SPAWN = { x: 4.5 * TILE, y: 7.5 * TILE };
const SWORD_POS = { x: 11.5 * TILE, y: 7.5 * TILE };
const SIGN_TILE = { x: 65, y: 27 };
const MONSTER_SPAWNS = [];

function generateWorld() {
  const rnd = mulberry32(WORLD_SEED);
  // base grass with dirt patches
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const n = Math.sin(x * 0.37) * Math.cos(y * 0.29) + Math.sin((x + y) * 0.13) * 0.6;
    map[idx(x, y)] = n > 0.95 ? T.DIRT : T.GRASS;
    variant[idx(x, y)] = Math.floor(rnd() * 3);
  }
  // the cave: walls all round a hollow, pillars inside, corridor exit at y=7
  for (let y = 0; y <= 15; y++) for (let x = 0; x <= CAVE_EXIT_X; x++) {
    const border = x === 0 || y === 0 || y === 15 || (x >= 16 && (y < 6 || y > 8));
    setTile(x, y, border ? T.WALL : T.CAVE);
  }
  for (let x = 16; x <= CAVE_EXIT_X; x++) { setTile(x, 5, T.WALL); setTile(x, 9, T.WALL); }
  for (let x = 1; x < 16; x++) { setTile(x, 15, T.WALL); }
  const pillars = [[3, 3], [4, 3], [8, 11], [9, 11], [9, 12], [12, 3], [13, 4], [5, 12], [13, 11]];
  for (const [px, py] of pillars) setTile(px, py, T.WALL);
  // a soft dirt path out of the cave heading east
  for (let x = CAVE_EXIT_X + 1; x < MAP_W - 4; x++) {
    const py = Math.round(7 + (SIGN_TILE.y - 7) * ((x - CAVE_EXIT_X) / (SIGN_TILE.x - CAVE_EXIT_X)));
    for (let dy = -1; dy <= 1; dy++) if (tileAt(x, py + dy) === T.GRASS && rnd() < 0.7) setTile(x, py + dy, T.DIRT);
  }
  // pond
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const d = dist(x, y, 43, 36);
    if (d < 4.5 + Math.sin(x * 1.3 + y * 0.7) * 1.2) setTile(x, y, T.WATER);
    else if (d < 6.5 + Math.sin(x * 0.9 + y * 1.1)) if (tileAt(x, y) !== T.WATER) setTile(x, y, T.SAND);
  }
  // trees and rocks, but never on the path or too near spawns
  for (let y = 0; y < MAP_H; y++) for (let x = CAVE_EXIT_X + 1; x < MAP_W; x++) {
    const t = tileAt(x, y);
    if (t !== T.GRASS) continue;
    if (Math.abs(x - SIGN_TILE.x) < 3 && Math.abs(y - SIGN_TILE.y) < 3) continue;
    const r = rnd();
    const denseForest = (y > 42) || (x > 56 && y < 14);
    if (r < (denseForest ? 0.28 : 0.07)) setTile(x, y, T.TREE);
    else if (r < (denseForest ? 0.30 : 0.10)) setTile(x, y, T.ROCK);
  }
  // world edge: wall of trees
  for (let x = 0; x < MAP_W; x++) { if (x > CAVE_EXIT_X) setTile(x, 0, T.TREE); setTile(x, MAP_H - 1, T.TREE); }
  for (let y = 0; y < MAP_H; y++) { setTile(MAP_W - 1, y, T.TREE); if (y > 15) setTile(0, y, T.TREE); }
  // the signpost
  setTile(SIGN_TILE.x, SIGN_TILE.y, T.SIGN);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) setTile(SIGN_TILE.x + dx, SIGN_TILE.y + dy, T.DIRT);
  // monsters
  const goblinSpots = [[27, 5], [30, 9], [26, 11], [36, 14], [40, 8], [47, 20], [52, 28], [58, 22], [55, 34], [62, 30], [48, 40], [66, 18]];
  for (const [gx, gy] of goblinSpots) MONSTER_SPAWNS.push({ type: 'goblin', tx: gx, ty: gy });
  const boarSpots = [[30, 24], [34, 30], [26, 36], [40, 46], [60, 44]];
  for (const [bx, by] of boarSpots) MONSTER_SPAWNS.push({ type: 'boar', tx: bx, ty: by });
  for (const s of MONSTER_SPAWNS) {
    // make sure the spawn tile and its ring are walkable
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const t = tileAt(s.tx + dx, s.ty + dy);
      if (t === T.TREE || t === T.ROCK) setTile(s.tx + dx, s.ty + dy, T.GRASS);
    }
  }
}
generateWorld();
const isSolidTile = (tx, ty) => SOLID.has(tileAt(tx, ty));
const isCaveTile = (tx, ty) => tx <= CAVE_EXIT_X && ty <= 15;

// ============================================================================
// TILE TEXTURES (procedural, smooth shapes, no pixel look)
// ============================================================================
const tex = {};
function makeTex(key, draw) {
  const c = document.createElement('canvas');
  c.width = TILE * DPR; c.height = TILE * DPR;
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  draw(g);
  tex[key] = c;
}
function buildTextures() {
  const rnd = mulberry32(777);
  for (let v = 0; v < 3; v++) {
    makeTex('grass' + v, g => {
      const grad = g.createLinearGradient(0, 0, TILE, TILE);
      grad.addColorStop(0, '#5aa33e'); grad.addColorStop(1, '#4c9134');
      g.fillStyle = grad; g.fillRect(0, 0, TILE, TILE);
      g.lineCap = 'round';
      for (let i = 0; i < 34; i++) {
        const x = rnd() * TILE, y = rnd() * TILE, h = 5 + rnd() * 6, bend = (rnd() - 0.5) * 6;
        g.strokeStyle = rnd() < 0.5 ? '#6fc24a' : '#3f7d2b'; g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + bend, y - h * 0.6, x + bend * 1.4, y - h); g.stroke();
      }
      if (v === 2) for (let i = 0; i < 3; i++) { g.fillStyle = '#e8e26b'; g.beginPath(); g.arc(rnd() * TILE, rnd() * TILE, 1.6, 0, 7); g.fill(); }
    });
    makeTex('dirt' + v, g => {
      const grad = g.createLinearGradient(0, 0, TILE, TILE);
      grad.addColorStop(0, '#9a7448'); grad.addColorStop(1, '#8a6740');
      g.fillStyle = grad; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 40; i++) { g.fillStyle = rnd() < 0.5 ? '#7a5a36' : '#a8875a'; g.beginPath(); g.arc(rnd() * TILE, rnd() * TILE, 0.8 + rnd() * 1.4, 0, 7); g.fill(); }
      for (let i = 0; i < 3; i++) { g.fillStyle = '#6e5232'; g.beginPath(); g.ellipse(rnd() * TILE, rnd() * TILE, 3 + rnd() * 2, 2 + rnd(), rnd() * 3, 0, 7); g.fill(); }
    });
    makeTex('cave' + v, g => {
      g.fillStyle = '#5d5f66'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 6; i++) { g.fillStyle = rnd() < 0.5 ? '#54565d' : '#66686f'; g.beginPath(); g.ellipse(rnd() * TILE, rnd() * TILE, 6 + rnd() * 8, 4 + rnd() * 5, rnd() * 3, 0, 7); g.fill(); }
      g.strokeStyle = '#46484e'; g.lineWidth = 1.2;
      for (let i = 0; i < 3; i++) { const x = rnd() * TILE, y = rnd() * TILE; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 18, y + (rnd() - 0.5) * 18); g.lineTo(x + (rnd() - 0.5) * 24, y + (rnd() - 0.5) * 24); g.stroke(); }
    });
    makeTex('wall' + v, g => {
      g.fillStyle = '#2f3138'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 5; i++) {
        const cx = rnd() * TILE, cy = rnd() * TILE, r = 9 + rnd() * 9;
        g.fillStyle = ['#3d3f47', '#45474f', '#383a41'][i % 3];
        g.beginPath();
        for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2, rr = r * (0.7 + rnd() * 0.4); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
        g.closePath(); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1.5; g.stroke();
      }
    });
    makeTex('water' + v, g => {
      const grad = g.createLinearGradient(0, 0, TILE, TILE);
      grad.addColorStop(0, '#3d86c6'); grad.addColorStop(1, '#2f6faa');
      g.fillStyle = grad; g.fillRect(0, 0, TILE, TILE);
      g.strokeStyle = 'rgba(210,235,255,0.55)'; g.lineWidth = 1.5; g.lineCap = 'round';
      for (let i = 0; i < 5; i++) { const x = rnd() * TILE, y = rnd() * TILE, w = 6 + rnd() * 10; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - 3, x + w, y); g.stroke(); }
    });
    makeTex('sand' + v, g => {
      g.fillStyle = '#d9c88a'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 30; i++) { g.fillStyle = rnd() < 0.5 ? '#c9b676' : '#e6d79d'; g.beginPath(); g.arc(rnd() * TILE, rnd() * TILE, 0.8 + rnd(), 0, 7); g.fill(); }
    });
    makeTex('plank' + v, g => {
      g.fillStyle = '#a5763f'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 4; i++) {
        g.fillStyle = i % 2 ? '#b5844a' : '#9c6d38'; g.fillRect(0, i * 12, TILE, 12);
        g.strokeStyle = '#6d4a24'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, i * 12 + 0.5); g.lineTo(TILE, i * 12 + 0.5); g.stroke();
        g.strokeStyle = 'rgba(80,50,20,0.35)'; g.beginPath(); g.moveTo(3, i * 12 + 6); g.quadraticCurveTo(TILE / 2, i * 12 + 4 + rnd() * 4, TILE - 3, i * 12 + 6); g.stroke();
      }
      g.fillStyle = '#4a3218'; for (const [x, y] of [[6, 6], [42, 6], [6, 42], [42, 42]]) { g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    });
  }
}
buildTextures();
const TEX_NAME = { [T.GRASS]: 'grass', [T.DIRT]: 'dirt', [T.CAVE]: 'cave', [T.WALL]: 'wall', [T.WATER]: 'water', [T.SAND]: 'sand', [T.PLANK]: 'plank', [T.TREE]: 'grass', [T.ROCK]: 'grass', [T.SIGN]: 'dirt' };

// ============================================================================
// GAME STATE
// ============================================================================
const SKILL_DEFS = [
  { key: 'melee', name: 'Melee', locked: false },
  { key: 'defence', name: 'Defence', locked: false },
  { key: 'range', name: 'Range', locked: true },
  { key: 'fishing', name: 'Fishing', locked: true },
  { key: 'cooking', name: 'Cooking', locked: true },
];
const xpToNext = lv => Math.floor(60 * Math.pow(lv, 1.6));

function newPlayer() {
  const skills = {};
  for (const s of SKILL_DEFS) skills[s.key] = { lv: 1, xp: 0 };
  return {
    x: SPAWN.x, y: SPAWN.y, r: 13, facing: { x: 1, y: 0 }, speed: 175,
    hp: 20, maxHp: 20, attackT: 0, attackCd: 0, hurtT: 0, sinceHurt: 99, walkT: 0, moving: false,
    hasSword: false, gold: 0, inv: { wood: 0, stone: 0, plank: 0, scrap: 0 }, skills, kills: 0,
    dead: false, deadT: 0, deaths: 0,
  };
}
const MONSTER_DEFS = {
  goblin: { name: 'Goblin soldier', r: 12, hp: 12, speed: 120, dmg: [2, 4], aggro: true, sight: 7 * TILE, xp: 24, gold: [3, 9], scrap: 0.6 },
  boar: { name: 'Boar', r: 14, hp: 18, speed: 150, dmg: [3, 5], aggro: false, sight: 6 * TILE, xp: 30, gold: [0, 2], scrap: 0 },
};
let player = newPlayer();
let monsters = [];
let drops = [];
let particles = [];
let floaters = [];
let swordTaken = false;
let quest = { stage: 0, kills: 0 };
let paused = false;
let showSkills = false;
let craftOpen = false;
let time = 0;
let levelBanner = null; // {text, t}
let dialog = { queue: [], cur: null, shown: 0, t: 0 };
let notice = null; // {text, t}
let mapDiffs = new Map(); // tile index -> new tile (for save)

function spawnMonsters() {
  monsters = [];
  for (const s of MONSTER_SPAWNS) {
    const d = MONSTER_DEFS[s.type];
    monsters.push({
      type: s.type, x: (s.tx + 0.5) * TILE, y: (s.ty + 0.5) * TILE, home: { x: (s.tx + 0.5) * TILE, y: (s.ty + 0.5) * TILE },
      r: d.r, hp: d.hp, maxHp: d.hp, speed: d.speed, angry: d.aggro, state: 'idle', wanderT: Math.random() * 2,
      wander: { x: 0, y: 0 }, attackCd: 0, hurtT: 0, dead: false, deadT: 0, respawnT: 0, facing: { x: 1, y: 0 }, walkT: 0, moving: false,
    });
  }
}
spawnMonsters();

function say(text, who = 'The Voice') { dialog.queue.push({ text, who }); }
function notify(text) { notice = { text, t: 2.6 }; }
function floatText(x, y, text, color = '#fff', size = 15) { floaters.push({ x, y, text, color, size, t: 1.1, vy: -38 }); }
function burst(x, y, color, n = 10, speed = 90) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random()); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.5 + Math.random() * 0.4, color, r: 2 + Math.random() * 2.5 }); }
}

function questText() {
  switch (quest.stage) {
    case 0: return 'Wake up.';
    case 1: return 'Find the sword in the light.';
    case 2: return 'Follow the Voice out of the cave (east).';
    case 3: return `First Blood: defeat goblins (${quest.kills}/3)`;
    case 4: return 'Follow the dirt road east to the signpost.';
    default: return 'Chapter 1 complete. Explore, fight, build.';
  }
}
function advanceQuest(stage) {
  if (stage <= quest.stage) return;
  quest.stage = stage;
  if (stage === 1) { say("You're finally awake.", 'The Voice'); say("There. In the light. Take it. You will need it.", 'The Voice'); }
  if (stage === 2) { say("A wooden sword. It will do for now. Follow my voice, knight. The way out is east.", 'The Voice'); }
  if (stage === 3) { say("Goblins. They have been getting bolder. Show them what a knight is.", 'The Voice'); say("Swing with Space. Hit them from the front. Do not let them surround you.", 'The Voice'); }
  if (stage === 4) { say("Good. That is enough for one morning. Follow the dirt road east. There is a signpost.", 'The Voice'); say("The goblins have machines now. Barrels that walk. You will see what they did to Hollowford.", 'The Voice'); }
  if (stage === 5) { say("Hollowford lies beyond. That is where your story really begins.", 'The Voice'); say("This is the end of Chapter 1. Chapter 2 is being built.", 'Fanglands'); levelBanner = { text: 'CHAPTER 1 COMPLETE', sub: 'The Cave', t: 4 }; }
  save();
}

// ============================================================================
// SAVE / LOAD (browser storage; wrapped so a blocked store never breaks play)
// ============================================================================
function save() {
  try {
    const data = { player, quest, swordTaken, mapDiffs: [...mapDiffs.entries()], blockHp: [...blockHp.entries()] };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) { /* storage unavailable: play on without saving */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    const fresh = newPlayer();
    player = Object.assign(fresh, d.player, { attackT: 0, attackCd: 0, hurtT: 0, dead: false, deadT: 0 });
    for (const s of SKILL_DEFS) if (!player.skills[s.key]) player.skills[s.key] = { lv: 1, xp: 0 };
    quest = d.quest || quest;
    swordTaken = !!d.swordTaken;
    mapDiffs = new Map(d.mapDiffs || []);
    for (const [i, t] of mapDiffs) map[i] = t;
    blockHp.clear(); for (const [i, h] of (d.blockHp || [])) blockHp.set(i, h);
    return true;
  } catch (e) { return false; }
}
function newGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
  map.fill(0); MONSTER_SPAWNS.length = 0; generateWorld();
  mapDiffs = new Map(); blockHp.clear();
  player = newPlayer(); quest = { stage: 0, kills: 0 }; swordTaken = false;
  drops = []; particles = []; floaters = []; dialog = { queue: [], cur: null, shown: 0, t: 0 };
  spawnMonsters(); paused = false; craftOpen = false;
  time = 0; introT = 0;
}
function changeTile(tx, ty, t) { setTile(tx, ty, t); mapDiffs.set(idx(tx, ty), t); blockHp.delete(idx(tx, ty)); }

// ============================================================================
// INPUT (keyboard + touch)
// ============================================================================
const keys = new Set();
const pressed = new Set();
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touch = { stickId: null, ox: 0, oy: 0, dx: 0, dy: 0, active: false, taps: [] };
const buttons = []; // on-screen hit rects: {x,y,w,h,label,action}
function pointerDown(x, y, id) {
  // on-screen buttons first (both touch and mouse)
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return; }
  if (dialog.cur && y > VH - 150 && Math.abs(x - VW / 2) < 360) { advanceDialog(); return; }
  if (isTouch && x < VW * 0.5 && touch.stickId === null) { touch.stickId = id; touch.ox = x; touch.oy = y; touch.dx = 0; touch.dy = 0; touch.active = true; return; }
  if (isTouch) touch.taps.push('attack');
}
function pointerMove(x, y, id) {
  if (touch.stickId === id) { const dx = x - touch.ox, dy = y - touch.oy, d = Math.hypot(dx, dy), m = Math.min(d, 60) / 60; touch.dx = d ? dx / d * m : 0; touch.dy = d ? dy / d * m : 0; }
}
function pointerUp(id) { if (touch.stickId === id) { touch.stickId = null; touch.active = false; touch.dx = touch.dy = 0; } }
canvas.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.changedTouches) pointerDown(t.clientX, t.clientY, t.identifier); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) pointerMove(t.clientX, t.clientY, t.identifier); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); for (const t of e.changedTouches) pointerUp(t.identifier); }, { passive: false });
canvas.addEventListener('touchcancel', e => { for (const t of e.changedTouches) pointerUp(t.identifier); });
canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY, 'mouse'));
canvas.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY, 'mouse'));
window.addEventListener('mouseup', () => pointerUp('mouse'));

function inputVector() {
  let x = 0, y = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  if (x || y) { const d = Math.hypot(x, y); return { x: x / d, y: y / d, m: 1 }; }

// PHYSICS

// ============================================================================
// WORLD INTERACTION
// ============================================================================
function useAction() {

  if (t === T.WATER) { notify('Fish flick under the surface. Fishing is locked for now.'); return; }

    player.attackT = 0.22;

    burst(tx * TILE + TILE / 2, ty * TILE + TILE / 2, t === T.ROCK ? '#9a9da5' : '#8b5a2b', 6, 60);
    if (left > 0) { blockHp.set(i, left); return; }

    else if (t === T.ROCK) { changeTile(tx, ty, T.DIRT); player.inv.stone += 2; floatText(player.x, player.y - 30, '+2 stone', '#c8ccd4'); }
    else if (t === T.PLANK) { changeTile(tx, ty, T.GRASS); player.inv.plank += 1; floatText(player.x, player.y - 30, '+1 plank', '#e0b070'); }

}

  const { tx, ty } = frontTile(player, 40);
  const t = tileAt(tx, ty);
  if (![T.GRASS, T.DIRT, T.SAND, T.CAVE].includes(t)) { notify('Cannot place there.'); return; }

  for (const d of drops) if (circleHitsTile(d.x, d.y, 8, tx, ty)) { notify('Pick that up first.'); return; }

    const nx = player.x - player.facing.x * 2.5, ny = player.y - player.facing.y * 2.5;

// ============================================================================
// UPDATE
// ============================================================================

        if (d.kind === 'gold') { player.gold += d.amt; floatText(player.x, player.y - 30, `+${d.amt} gold`, '#ffd166'); }

}
