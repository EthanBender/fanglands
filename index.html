<script>
'use strict';
// ============================================================================
// Fanglands v1 — Chapter 1 "The Cave" + Chapter 2 "Thistledown"
// A 2D top-down knight adventure. Textured shapes, not pixels.
// Everything is in this one file on purpose: open it and it runs.
// Self-check: open the console and run FANGLANDS.selfTest()
// ============================================================================

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- constants ----------
const TILE = 48;
const MAP_W = 120, MAP_H = 56;
const WORLD_SEED = 20260907;
const CAVE_EXIT_X = 20; // tiles left of this (and above row 15) are "the cave"
const VILLAGE = { x0: 79, y0: 15, x1: 114, y1: 42, name: 'Thistledown' };
const T = { GRASS: 0, DIRT: 1, CAVE: 2, WALL: 3, WATER: 4, TREE: 5, ROCK: 6, PLANK: 7, SAND: 8, SIGN: 9, OAK: 10, IRON: 11, COBBLE: 12, HOUSE: 13, FENCE: 14, FIRE: 15, DUMMY: 16, GRAVE: 17 };
const SOLID = new Set([T.WALL, T.WATER, T.TREE, T.ROCK, T.PLANK, T.SIGN, T.OAK, T.IRON, T.HOUSE, T.FENCE, T.FIRE, T.DUMMY, T.GRAVE]);
// what breaking a block needs and gives. Trees and rocks grow back after `regrow` seconds.
const BLOCKS = {
  [T.TREE]: { hits: 3, skill: 'woodcutting', lv: 1, xp: 25, item: 'wood', qty: 3, becomes: T.GRASS, regrow: 60, label: 'tree' },
  [T.OAK]: { hits: 5, skill: 'woodcutting', lv: 5, xp: 60, item: 'oak_log', qty: 2, becomes: T.GRASS, regrow: 90, label: 'oak' },
  [T.ROCK]: { hits: 4, skill: 'mining', lv: 1, xp: 35, item: 'stone', qty: 2, becomes: T.DIRT, regrow: 45, label: 'rock' },
  [T.IRON]: { hits: 6, skill: 'mining', lv: 5, xp: 80, item: 'iron_ore', qty: 1, becomes: T.DIRT, regrow: 75, label: 'iron rock' },
  [T.PLANK]: { hits: 1, item: 'plank', qty: 1, becomes: T.GRASS, label: 'plank' },
  [T.FIRE]: { hits: 1, item: 'wood', qty: 1, becomes: T.DIRT, label: 'campfire' },
};
const SAVE_KEY = 'fanglands.save.v1';
const INV_SLOTS = 16, BANK_SLOTS = 48;

// ---------- items ----------
const ITEMS = {
  wood: { name: 'Wood', value: 2, color: '#c9a36a', shape: 'log' },
  oak_log: { name: 'Oak log', value: 8, color: '#8a5a2b', shape: 'log' },
  stone: { name: 'Stone', value: 2, color: '#b8bcc4', shape: 'rock' },
  iron_ore: { name: 'Iron ore', value: 14, color: '#8e7d6b', shape: 'rock' },
  plank: { name: 'Plank', value: 3, color: '#d8a95e', shape: 'plank', place: T.PLANK },
  campfire: { name: 'Campfire kit', value: 6, color: '#e08a3a', shape: 'fire', place: T.FIRE },
  goblin_scrap: { name: 'Goblin scrap', value: 15, color: '#9fd3ff', shape: 'scrap' },
  spider_silk: { name: 'Spider silk', value: 4, color: '#e9eef5', shape: 'silk' },

  cooked_beef: { name: 'Cooked beef', value: 12, color: '#8b4a2b', shape: 'meat', heal: 8 },
  raw_shrimp: { name: 'Raw shrimp', value: 3, color: '#f4b6a0', shape: 'fish', cook: 'shrimp' },

for (const k in ITEMS) { ITEMS[k].id = k; if (!ITEMS[k].stack) ITEMS[k].stack = 50; }
const SHOPS = {

  bakery: { name: "Rosalind's Bakery", stock: [['bread', 8], ['meat_pie', 25]] },
};
const RECIPES = [
  { out: 'plank', qty: 4, needs: [['wood', 2]], label: '2 Wood → 4 Planks' },
  { out: 'campfire', qty: 1, needs: [['wood', 3]], label: '3 Wood → Campfire kit' },
];

// ---------- canvas ----------
const DISPLAY = '"Cinzel", "Trajan Pro", Georgia, serif';
if (document.fonts && document.fonts.load) { document.fonts.load('800 34px "Cinzel"').catch(() => { }); }
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {

  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR); canvas.height = Math.floor(VH * DPR);

window.addEventListener('resize', resize);

// ============================================================================
// WORLD
// ============================================================================
const map = new Uint8Array(MAP_W * MAP_H);
const variant = new Uint8Array(MAP_W * MAP_H);
const blockHp = new Map(); // tile index -> hits remaining
let regrow = []; // {i, t, timer}
const idx = (tx, ty) => ty * MAP_W + tx;
const inMap = (tx, ty) => tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H;
const tileAt = (tx, ty) => inMap(tx, ty) ? map[idx(tx, ty)] : T.WALL;
const setTile = (tx, ty, t) => { if (inMap(tx, ty)) map[idx(tx, ty)] = t; };

const SPAWN = { x: 4.5 * TILE, y: 7.5 * TILE };
const VILLAGE_SPAWN = { x: 96.5 * TILE, y: 27.5 * TILE };
const SWORD_POS = { x: 11.5 * TILE, y: 7.5 * TILE };
const SIGN_TILE = { x: 65, y: 27 };
const MONSTER_SPAWNS = [];
const BUILDINGS = [
  { x: 82, y: 18, w: 6, h: 5, name: 'General Store', roof: '#7a3b2e', sign: 'STORE' },
  { x: 90, y: 18, w: 7, h: 5, name: 'Bank of Thistledown', roof: '#3b4a7a', sign: 'BANK' },
  { x: 99, y: 18, w: 5, h: 5, name: 'Bakery', roof: '#8a6a2e', sign: 'BAKERY' },
  { x: 91, y: 34, w: 11, h: 6, name: "Duke's Hall", roof: '#5a2e7a', sign: 'HALL' },
  { x: 82, y: 34, w: 5, h: 5, name: 'House', roof: '#6a4a3a' },
  { x: 106, y: 26, w: 5, h: 4, name: 'House', roof: '#4a5a3a' },
  { x: 106, y: 33, w: 5, h: 5, name: 'House', roof: '#6a4a3a' },
];
const DUMMIES = [[84, 27], [84, 29], [84, 31]];
const GRAVES = [[24, 11], [108, 19], [110, 19], [109, 21]];
const NPCS = [
  { id: 'marta', name: 'Marta', x: 85, y: 23.6, tunic: '#b04a3a', hair: '#3a2a1a', apron: true, role: 'shop', shop: 'general' },
  { id: 'aldous', name: 'Aldous the banker', x: 93.5, y: 23.6, tunic: '#2e3b6a', hair: '#d9d0c0', role: 'bank' },
  { id: 'rosalind', name: 'Rosalind', x: 101.5, y: 23.6, tunic: '#c89a4a', hair: '#7a3a1a', apron: true, role: 'shop', shop: 'bakery', woman: true },
  { id: 'duke', name: 'Duke Ferrin', x: 96.5, y: 33.4, tunic: '#5a2e7a', hair: '#8a7a6a', crown: true, role: 'duke' },
  { id: 'hale', name: 'Sergeant Hale', x: 86.5, y: 29.5, tunic: '#4a4f5a', hair: '#2a1a0a', helmet: true, role: 'trainer' },
  { id: 'tobin', name: 'Tobin', x: 90.5, y: 29.5, tunic: '#6a6a4a', hair: '#5a3a1a', role: 'bread' },
];

function generateWorld() {
  const rnd = mulberry32(WORLD_SEED);
  MONSTER_SPAWNS.length = 0;
  // base grass with dirt patches
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const n = Math.sin(x * 0.37) * Math.cos(y * 0.29) + Math.sin((x + y) * 0.13) * 0.6;
    map[idx(x, y)] = n > 0.95 ? T.DIRT : T.GRASS;
    variant[idx(x, y)] = Math.floor(rnd() * 3);
  }
  // the cave
  for (let y = 0; y <= 15; y++) for (let x = 0; x <= CAVE_EXIT_X; x++) {
    const border = x === 0 || y === 0 || y === 15 || (x >= 16 && (y < 6 || y > 8));
    setTile(x, y, border ? T.WALL : T.CAVE);
  }
  for (let x = 16; x <= CAVE_EXIT_X; x++) { setTile(x, 5, T.WALL); setTile(x, 9, T.WALL); }
  for (const [px, py] of [[3, 3], [4, 3], [8, 11], [9, 11], [9, 12], [12, 3], [13, 4], [5, 12], [13, 11]]) setTile(px, py, T.WALL);
  // dirt road: cave → signpost → village gate
  const road = [[CAVE_EXIT_X + 1, 7], [SIGN_TILE.x, SIGN_TILE.y], [VILLAGE.x0, 28]];
  for (let s = 0; s < road.length - 1; s++) {
    const [ax, ay] = road[s], [bx, by] = road[s + 1];
    for (let x = ax; x <= bx; x++) {
      const py = Math.round(ay + (by - ay) * ((x - ax) / (bx - ax)));
      for (let dy = -1; dy <= 1; dy++) if (tileAt(x, py + dy) === T.GRASS && rnd() < 0.7) setTile(x, py + dy, T.DIRT);
    }
  }
  // ponds
  const ponds = [[43, 36, 4.5], [104, 45, 3.2]];
  for (const [px, py, pr] of ponds) for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const d = dist(x, y, px, py);
    if (d < pr + Math.sin(x * 1.3 + y * 0.7) * 1.2) setTile(x, y, T.WATER);
    else if (d < pr + 2 + Math.sin(x * 0.9 + y * 1.1)) if (tileAt(x, y) !== T.WATER) setTile(x, y, T.SAND);
  }
  // trees and rocks
  const inVillage = (x, y) => x >= VILLAGE.x0 && x <= VILLAGE.x1 && y >= VILLAGE.y0 && y <= VILLAGE.y1;
  for (let y = 0; y < MAP_H; y++) for (let x = CAVE_EXIT_X + 1; x < MAP_W; x++) {
    const t = tileAt(x, y);
    if (t !== T.GRASS) continue;
    if (Math.abs(x - SIGN_TILE.x) < 3 && Math.abs(y - SIGN_TILE.y) < 3) continue;
    if (inVillage(x, y)) continue;
    const r = rnd();
    const denseForest = (y > 42) || (x > 56 && x < 78 && y < 14) || (x > 114);
    if (r < (denseForest ? 0.28 : 0.07)) setTile(x, y, rnd() < 0.18 ? T.OAK : T.TREE);
    else if (r < (denseForest ? 0.30 : 0.10)) setTile(x, y, rnd() < 0.25 ? T.IRON : T.ROCK);
  }
  // world edge
  for (let x = 0; x < MAP_W; x++) { if (x > CAVE_EXIT_X) setTile(x, 0, T.TREE); setTile(x, MAP_H - 1, T.TREE); }
  for (let y = 0; y < MAP_H; y++) { setTile(MAP_W - 1, y, T.TREE); if (y > 15) setTile(0, y, T.TREE); }
  // signpost
  setTile(SIGN_TILE.x, SIGN_TILE.y, T.SIGN);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) setTile(SIGN_TILE.x + dx, SIGN_TILE.y + dy, T.DIRT);
  // ---- the village ----
  for (let y = VILLAGE.y0; y <= VILLAGE.y1; y++) for (let x = VILLAGE.x0; x <= VILLAGE.x1; x++) if ([T.TREE, T.OAK, T.ROCK, T.IRON].includes(tileAt(x, y))) setTile(x, y, T.GRASS);
  for (let y = 24; y <= 32; y++) for (let x = 88; x <= 104; x++) setTile(x, y, T.COBBLE); // square
  for (let x = VILLAGE.x0; x <= 88; x++) for (let dy = -1; dy <= 1; dy++) setTile(x, 28 + dy, T.COBBLE); // gate road
  for (let y = 23; y <= 33; y++) for (let x = 84; x <= 86; x++) if (tileAt(x, y) === T.GRASS) setTile(x, y, T.DIRT); // yard
  for (const b of BUILDINGS) for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) setTile(x, y, T.HOUSE);
  for (const [dx, dy] of DUMMIES) setTile(dx, dy, T.DUMMY);
  for (const [gx, gy] of GRAVES) setTile(gx, gy, T.GRAVE);
  setTile(98, 28, T.FIRE);
  // village fence with a gate on the west road
  for (let x = VILLAGE.x0; x <= VILLAGE.x1; x++) { if (tileAt(x, VILLAGE.y0) !== T.HOUSE) setTile(x, VILLAGE.y0, T.FENCE); if (tileAt(x, VILLAGE.y1) !== T.HOUSE) setTile(x, VILLAGE.y1, T.FENCE); }
  for (let y = VILLAGE.y0; y <= VILLAGE.y1; y++) { if (Math.abs(y - 28) > 1) setTile(VILLAGE.x0, y, T.FENCE); if (y !== 44) setTile(VILLAGE.x1, y, T.FENCE); }
  // animal pens west of the village
  const pen = (x0, y0, x1, y1, gapY) => { for (let x = x0; x <= x1; x++) { setTile(x, y0, T.FENCE); setTile(x, y1, T.FENCE); } for (let y = y0; y <= y1; y++) { setTile(x0, y, T.FENCE); if (y !== gapY) setTile(x1, y, T.FENCE); } for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) setTile(x, y, T.GRASS); };
  pen(68, 35, 76, 41, 38); pen(68, 13, 76, 20, 17);
  // monsters
  const spawn = (type, list) => { for (const [x, y] of list) MONSTER_SPAWNS.push({ type, tx: x, ty: y }); };
  spawn('goblin', [[27, 5], [30, 9], [26, 11], [36, 14], [40, 8], [47, 20], [52, 28], [58, 22], [55, 34], [62, 30], [48, 40], [66, 18], [72, 26], [60, 46], [100, 50], [116, 30]]);
  spawn('boar', [[30, 24], [34, 30], [26, 36], [40, 46], [60, 44], [90, 48]]);
  spawn('spider', [[3, 12], [7, 3], [11, 12], [14, 9], [6, 6]]);
  spawn('sheep', [[70, 37], [73, 39], [72, 36], [75, 38]]);
  spawn('cow', [[70, 15], [73, 18], [75, 15]]);
  spawn('guard_m', [[81, 27], [100, 31]]); spawn('guard_f', [[95, 22.5], [104, 36]]);
  for (const s of MONSTER_SPAWNS) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const t = tileAt(Math.floor(s.tx) + dx, Math.floor(s.ty) + dy);
    if ([T.TREE, T.OAK, T.ROCK, T.IRON].includes(t)) setTile(Math.floor(s.tx) + dx, Math.floor(s.ty) + dy, T.GRASS);
  }
}
generateWorld();
const isSolidTile = (tx, ty) => SOLID.has(tileAt(tx, ty));
const isCaveTile = (tx, ty) => tx <= CAVE_EXIT_X && ty <= 15;
const inVillageBounds = (x, y) => x > VILLAGE.x0 * TILE && x < VILLAGE.x1 * TILE && y > VILLAGE.y0 * TILE && y < VILLAGE.y1 * TILE;

// ============================================================================
// TILE TEXTURES (procedural, smooth shapes, no pixel look)
// ============================================================================
const tex = {};
function makeTex(key, draw) {
  const c = document.createElement('canvas');
  c.width = TILE * 2; c.height = TILE * 2;
  const g = c.getContext('2d'); g.scale(2, 2); draw(g); tex[key] = c;
}
function buildTextures() {
  const rnd = mulberry32(777);
  for (let v = 0; v < 3; v++) {
    makeTex('grass' + v, g => {
      const grad = g.createLinearGradient(0, 0, TILE, TILE); grad.addColorStop(0, '#5aa33e'); grad.addColorStop(1, '#4c9134');
      g.fillStyle = grad; g.fillRect(0, 0, TILE, TILE); g.lineCap = 'round';
      for (let i = 0; i < 34; i++) { const x = rnd() * TILE, y = rnd() * TILE, h = 5 + rnd() * 6, bend = (rnd() - 0.5) * 6; g.strokeStyle = rnd() < 0.5 ? '#6fc24a' : '#3f7d2b'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + bend, y - h * 0.6, x + bend * 1.4, y - h); g.stroke(); }
      if (v === 2) for (let i = 0; i < 3; i++) { g.fillStyle = '#e8e26b'; g.beginPath(); g.arc(rnd() * TILE, rnd() * TILE, 1.6, 0, 7); g.fill(); }
    });
    makeTex('dirt' + v, g => {
      const grad = g.createLinearGradient(0, 0, TILE, TILE); grad.addColorStop(0, '#9a7448'); grad.addColorStop(1, '#8a6740');
      g.fillStyle = grad; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 40; i++) { g.fillStyle = rnd() < 0.5 ? '#7a5a36' : '#a8875a'; g.beginPath(); g.arc(rnd() * TILE, rnd() * TILE, 0.8 + rnd() * 1.4, 0, 7); g.fill(); }
      for (let i = 0; i < 3; i++) { g.fillStyle = '#6e5232'; g.beginPath(); g.ellipse(rnd() * TILE, rnd() * TILE, 3 + rnd() * 2, 2 + rnd(), rnd() * 3, 0, 7); g.fill(); }
    });
    makeTex('cave' + v, g => {
      g.fillStyle = '#5d5f66'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 6; i++) { g.fillStyle = rnd() < 0.5 ? '#54565d' : '#66686f'; g.beginPath(); g.ellipse(rnd() * TILE, rnd() * TILE, 6 + rnd() * 8, 4 + rnd() * 5, rnd() * 3, 0, 7); g.fill(); }
      g.strokeStyle = '#46484e'; g.lineWidth = 1.2;
      for (let i = 0; i < 3; i++) { const x = rnd() * TILE, y = rnd() * TILE; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 18, y + (rnd() - 0.5) * 18); g.lineTo(x + (rnd() - 0.5) * 24, y + (rnd() - 0.5) * 24); g.stroke(); }
    });
    makeTex('wall' + v, g => {
      g.fillStyle = '#2f3138'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 5; i++) { const cx = rnd() * TILE, cy = rnd() * TILE, r = 9 + rnd() * 9; g.fillStyle = ['#3d3f47', '#45474f', '#383a41'][i % 3]; g.beginPath(); for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2, rr = r * (0.7 + rnd() * 0.4); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } g.closePath(); g.fill(); g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1.5; g.stroke(); }
    });
    makeTex('water' + v, g => {
      const grad = g.createLinearGradient(0, 0, TILE, TILE); grad.addColorStop(0, '#3d86c6'); grad.addColorStop(1, '#2f6faa');
      g.fillStyle = grad; g.fillRect(0, 0, TILE, TILE); g.strokeStyle = 'rgba(210,235,255,0.55)'; g.lineWidth = 1.5; g.lineCap = 'round';
      for (let i = 0; i < 5; i++) { const x = rnd() * TILE, y = rnd() * TILE, w = 6 + rnd() * 10; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - 3, x + w, y); g.stroke(); }
    });
    makeTex('sand' + v, g => {
      g.fillStyle = '#d9c88a'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 30; i++) { g.fillStyle = rnd() < 0.5 ? '#c9b676' : '#e6d79d'; g.beginPath(); g.arc(rnd() * TILE, rnd() * TILE, 0.8 + rnd(), 0, 7); g.fill(); }
    });
    makeTex('plank' + v, g => {
      g.fillStyle = '#a5763f'; g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#b5844a' : '#9c6d38'; g.fillRect(0, i * 12, TILE, 12); g.strokeStyle = '#6d4a24'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, i * 12 + 0.5); g.lineTo(TILE, i * 12 + 0.5); g.stroke(); g.strokeStyle = 'rgba(80,50,20,0.35)'; g.beginPath(); g.moveTo(3, i * 12 + 6); g.quadraticCurveTo(TILE / 2, i * 12 + 4 + rnd() * 4, TILE - 3, i * 12 + 6); g.stroke(); }
      g.fillStyle = '#4a3218'; for (const [x, y] of [[6, 6], [42, 6], [6, 42], [42, 42]]) { g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    });

// UPDATE
// ============================================================================
let introT = 0;
function update(dt) {

  if (!paused) {
    if (pressed.has('Tab')) panel === 'skills' ? closePanel() : openPanel('skills');
    if (pressed.has('KeyI')) panel === 'inventory' ? closePanel() : openPanel('inventory');
    if (pressed.has('KeyC')) panel === 'craft' ? closePanel() : openPanel('craft');
    if (pressed.has('KeyJ')) panel === 'quests' ? closePanel() : openPanel('quests');
    if (pressed.has('Enter') && dialog.cur) advanceDialog();
    for (let k = 1; k <= 5; k++) if (pressed.has('Digit' + k)) useItem(k - 1);
  }
  if (paused) { pressed.clear(); return; }

  if (!dialog.cur && dialog.queue.length) { dialog.cur = dialog.queue.shift(); dialog.shown = 0; dialog.t = 0; }

      if (pressed.has('KeyQ')) placeAction();
    }
    if (!swordTaken && dist(player.x, player.y, SWORD_POS.x, SWORD_POS.y) < 30) {
      swordTaken = true; addItem('wooden_sword', 1); player.weapon = 'wooden_sword'; burst(SWORD_POS.x, SWORD_POS.y, '#fff2a8', 20, 120);
      floatText(player.x, player.y - 30, 'Wooden sword!', '#fff2a8', 18); advanceQuest(2);
    }
    if (quest.stage === 2 && player.x > (CAVE_EXIT_X + 1.5) * TILE) advanceQuest(3);
    if (!player.visitedVillage && inVillageBounds(player.x, player.y)) { player.visitedVillage = true; levelBanner = { text: 'THISTLEDOWN', sub: 'A village that still stands', t: 3.5 }; say("Thistledown. You will respawn here now if you fall. The Duke's hall is the big roof to the south.", 'The Voice'); save(); }

        if (d.gold) { player.gold += d.gold; floatText(player.x, player.y - 30, `+${d.gold} gold`, '#ffd166'); d.taken = true; }
        else { const left = addItem(d.id, d.qty); if (left < d.qty) floatText(player.x, player.y - 30, `+${d.qty - left} ${ITEMS[d.id].name}`, ITEMS[d.id].color); if (left > 0) { d.qty = left; if (!d.warned) { notify('Your pack is full.'); d.warned = true; } } else d.taken = true; }

}

    const bankOpen = panel === 'bank'; const woodSlot = player.inv.findIndex(s => s && s.id === 'plank'); const dep = this.clickButton('slot' + woodSlot); const inBank = player.bank.some(b => b.id === 'plank' && b.qty === 3); const wd = this.clickButton('bank0'); closePanel();
    check('bank deposit + withdraw', bankOpen && dep && inBank && wd && countItem('plank') === 3 && player.bank.length === 0, { wa, bankOpen, inBank });
    this.calm(); const dummy = DUMMIES[1]; goAdjacent(dummy[0], dummy[1]); face(dummy[0], dummy[1]); const mx0 = player.skills.melee.xp; const hh0 = player.highestHit; this.press('Space'); this.sim(30, []);
    check('training dummy gives small xp + records best hit', player.skills.melee.xp > mx0 && player.skills.melee.xp - mx0 <= 12 && player.highestHit >= hh0, { gained: player.skills.melee.xp - mx0, best: player.highestHit });
    const wt = this.talk('tobin'); const q1 = quest.bread; const g0 = player.gold; this.press('KeyE'); this.sim(2, []);
    check("Tobin's bread quest", q1 === 'active' && quest.bread === 'done' && player.gold === g0 + 30 && countItem('bread') === 0, { wt, bread: quest.bread });
    const duke = NPCS.find(n => n.id === 'duke'); const wdk = follow(Math.floor(duke.x), Math.floor(duke.y) - 1, 4000); face(duke.x - 0.5, duke.y - 0.5); this.press('KeyE'); this.sim(2, []);
    const st6 = quest.stage; player.skills.melee.xp = XP_TABLE[5]; player.skills.woodcutting.xp = XP_TABLE[3]; this.press('KeyE'); this.sim(2, []);
    check('Duke gates Chapter 2 on skill levels', st6 === 6 && quest.stage === 7, { wdk, st6, stage: quest.stage });
    // ---------- death, the coffin ----------
    player.inv = new Array(INV_SLOTS).fill(null); addItem('wooden_sword', 1); addItem('goblin_scrap', 2); addItem('wood', 3); player.gold = 100;
    hurtPlayer(player.hp + 20, player.x + 10, player.y); this.sim(200, []);
    const kept = deathKeep && deathKeep.items.map(s => s.id).sort().join(',');
    check('death: respawn in village, Death keeps the pack, sword stays', !player.dead && dist(player.x, player.y, VILLAGE_SPAWN.x, VILLAGE_SPAWN.y) < 5 && kept === 'goblin_scrap,wood' && countItem('wooden_sword') === 1, { kept, gold: player.gold });
    const grave = nearestTile([T.GRAVE]); goAdjacent(grave.x, grave.y); face(grave.x, grave.y); this.press('KeyE'); this.sim(2, []);
    const coffinOpen = panel === 'coffin'; const fee = coffinFee(); const rec = this.clickButton(`Reclaim everything for ${fee} gold`);
    check('coffin: cheap items free, valuables cost 25%', coffinOpen && fee === 8 && rec && player.gold === 92 && countItem('goblin_scrap') === 2 && countItem('wood') === 3 && !deathKeep, { fee, gold: player.gold });
    closePanel();
    // ---------- save / load ----------
    save(); const snap = JSON.stringify({ q: quest, g: player.gold, k: player.kills, inv: player.inv, bank: player.bank, hh: player.highestHit, diffs: mapDiffs.size, rg: regrow.length });
    const lv = skillLv('melee'); player = newPlayer(); quest = { stage: 0, kills: 0, bread: 'none' }; const ok = load();
    check('save/load round-trip', ok && skillLv('melee') === lv && JSON.stringify({ q: quest, g: player.gold, k: player.kills, inv: player.inv, bank: player.bank, hh: player.highestHit, diffs: mapDiffs.size, rg: regrow.length }) === snap, { loaded: ok, melee: skillLv('melee') });
    const fails = Object.values(report).filter(v => v.startsWith('FAIL')).length;
    report.summary = fails ? `${fails} FAILED` : 'ALL PASS';
    console.table(report);
    return report;
  },
};
